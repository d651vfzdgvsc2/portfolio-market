<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" font-family="'Microsoft YaHei','PingFang SC','Source Han Sans CN',sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="1120" height="730" fill="#ffffff"/>

  <text x="40" y="42" font-size="22" font-weight="800" fill="#1a1a1a">粤语多模态 AI Agent · 系统架构与数据流</text>

  <!-- 并合外框 -->
  <rect x="40" y="70" width="1040" height="596" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="60" y="652" font-size="14" font-weight="700" fill="#1a1a1a">同一系统 / 共用后端：账号 · 练习记录 · 作业 · 点评 · 班级</text>

  <!-- 泳道标题 -->
  <text x="70" y="104" font-size="18" font-weight="800" fill="#1a1a1a">学生端</text>
  <text x="650" y="104" font-size="18" font-weight="800" fill="#1a1a1a">教师端</text>

  <!-- 学生端 -->
  <rect x="70" y="126" width="400" height="50" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="90" y="156" font-size="15" font-weight="700" fill="#1a1a1a">学生录音 / 文字输入</text>

  <rect x="70" y="196" width="400" height="104" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="90" y="224" font-size="15" font-weight="700" fill="#1a1a1a">语音识别（多厂商）</text>
  <text x="90" y="250" font-size="13" fill="#1a1a1a">豆包大模型 ASR（主） · 阿里 qwen3-asr（并行）</text>
  <text x="90" y="272" font-size="13" fill="#1a1a1a">讯飞 IAT（交叉校验 / 兜底）</text>
  <text x="90" y="294" font-size="13" fill="#1a1a1a">→ 转写 + 语种识别 + 中英混合检测</text>

  <rect x="70" y="320" width="400" height="62" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="90" y="348" font-size="15" font-weight="700" fill="#1a1a1a">语音分析</text>
  <text x="90" y="370" font-size="13" fill="#1a1a1a">Cantonese.ai 发音评分 · 讯飞 SunTone 声调</text>

  <rect x="70" y="402" width="400" height="76" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="90" y="430" font-size="15" font-weight="700" fill="#1a1a1a">大模型 Agent</text>
  <text x="90" y="454" font-size="13" fill="#1a1a1a">判断语种 → 选教学动作</text>
  <text x="90" y="472" font-size="13" fill="#1a1a1a">→ 生成粤语回复（DeepSeek / OpenAI）</text>

  <rect x="70" y="498" width="400" height="54" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="90" y="531" font-size="15" font-weight="700" fill="#1a1a1a">输出：粤语回复 + 释义 + TTS 示范音</text>

  <rect x="70" y="572" width="400" height="52" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="90" y="604" font-size="15" font-weight="700" fill="#1a1a1a">练习记录 / 评分</text>

  <!-- 学生端纵向箭头 -->
  <line x1="270" y1="176" x2="270" y2="194" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="270" y1="300" x2="270" y2="318" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="270" y1="382" x2="270" y2="400" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="270" y1="478" x2="270" y2="496" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="270" y1="552" x2="270" y2="570" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 教师端 -->
  <rect x="650" y="320" width="340" height="56" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="670" y="354" font-size="15" font-weight="700" fill="#1a1a1a">查看班级 / 学生进度</text>

  <rect x="650" y="402" width="340" height="56" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="670" y="436" font-size="15" font-weight="700" fill="#1a1a1a">点评 / 批改</text>

  <rect x="650" y="498" width="340" height="56" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="670" y="532" font-size="15" font-weight="700" fill="#1a1a1a">布置作业 / 练习</text>

  <!-- 教师端纵向箭头 -->
  <line x1="820" y1="376" x2="820" y2="400" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="820" y1="458" x2="820" y2="496" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 跨端：练习记录 / 评分 传到教师端 -->
  <path d="M470,598 L620,598 L620,348 L644,348" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="476" y="590" font-size="13" font-weight="700" fill="#1a1a1a">练习记录 / 评分 →</text>

  <!-- 跨端：点评 / 作业 回到学生端 -->
  <line x1="650" y1="526" x2="474" y2="526" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="500" y="518" font-size="13" font-weight="700" fill="#1a1a1a">← 点评 / 作业</text>

  <!-- 说明 -->
  <text x="40" y="712" font-size="12.5" fill="#7a7a7a">说明：学生端与教师端在同一系统内通过后端数据流转（练习记录 → 教师端；点评 / 作业 → 学生端）。界面与数据为演示 / 模拟。</text>
</svg>
